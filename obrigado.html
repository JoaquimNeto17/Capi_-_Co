<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#252c1d">
  <title>Mensagem recebida | CAPI &amp; CO.</title>
  <style>
    :root{--bg:#252c1d;--green:#415030;--cream:#fff1d6;--accent:#e89a65;--ink:#342319;--paper:#f7f1e4}
    *{box-sizing:border-box}
    html,body{height:100%;overflow:hidden}
    body{margin:0;background:var(--bg);color:var(--cream);font:400 16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
    .page{height:100vh;height:100svh;display:flex;flex-direction:column;position:relative;isolation:isolate;overflow:hidden}
    .page::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(150deg,#34402b 0%,var(--bg) 60%,#1d2518 100%)}
    .header,.main,.footer{width:min(1400px,100%);margin-inline:auto;padding-inline:clamp(24px,7vw,100px)}
    .header{padding-top:clamp(26px,4vw,52px);display:flex;align-items:center;justify-content:space-between;gap:20px}
    .logo{display:block;width:clamp(175px,21vw,245px);height:auto}
    .header-note,.eyebrow,.card-label,.footer{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase}
    .header-note{color:#e6cd9b;text-align:right}
    .main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:clamp(48px,8vw,135px);padding-block-start:clamp(18px,3vh,46px);padding-block-end:clamp(32px,7vh,84px)}
    .intro{max-width:480px}
    .eyebrow{margin:0 0 26px;color:var(--accent)}
    .eyebrow::before{content:"";display:inline-block;width:30px;height:1px;background:currentColor;vertical-align:middle;margin-right:12px}
    h1{margin:0;color:var(--cream);font:italic 700 clamp(48px,5.2vw,76px)/1.04 Georgia,'Times New Roman',serif;letter-spacing:-.055em;text-wrap:balance}
    .intro-rule{display:block;width:76px;height:2px;background:var(--accent);margin:35px 0 23px}
    .intro-text{margin:0;max-width:36ch;color:#e7dfca;font-size:clamp(15px,1.3vw,18px);line-height:1.6}
    .card{position:relative;width:100%;max-width:490px;justify-self:end;padding:clamp(24px,3vw,42px);border-radius:12px;background:var(--paper);color:var(--ink);box-shadow:0 32px 85px #10190e55}
    .card::before{content:"";position:absolute;inset:11px;pointer-events:none;border:1px solid #34231920;border-radius:5px}
    .card-content{position:relative}
    .card-label{display:block;color:#6b6e54;margin-bottom:clamp(18px,2.5vw,30px)}
    .check{width:48px;height:48px;border-radius:50%;background:var(--green);display:grid;place-items:center;margin-bottom:18px;color:var(--cream)}
    .check svg{width:25px;height:25px}
    .card h2{font:italic 700 clamp(31px,2.7vw,42px)/1.07 Georgia,'Times New Roman',serif;letter-spacing:-.045em;margin:0 0 14px}
    .card p{margin:0 0 24px;max-width:34ch;color:#60574a;line-height:1.55}
    .back{display:inline-flex;align-items:center;justify-content:space-between;gap:30px;min-height:50px;padding:11px 13px 11px 21px;border-radius:100px;background:var(--accent);color:var(--ink);font-weight:700;text-decoration:none;transition:background-color .2s ease,transform .2s ease}
    .back:hover{background:#efae80;transform:translateY(-2px)}
    .back:focus-visible{outline:3px solid var(--green);outline-offset:4px}
    .back svg{width:26px;height:26px}
    .footer{display:flex;justify-content:space-between;gap:20px;align-items:center;padding-block:22px 30px;color:#d2c8ae;border-top:1px solid #fff1d62c}
    .footer span:last-child{color:#e6cd9b}
    @media(max-height:740px){
      .header{padding-top:20px}
      .logo{width:190px}
      .main{padding-block:15px 32px}
      h1{font-size:clamp(44px,5.5vw,74px)}
      .eyebrow{margin-bottom:16px}
      .intro-rule{margin:18px 0 13px}
      .card{padding:28px}
      .card-label{margin-bottom:20px}
      .check{width:44px;height:44px;margin-bottom:16px}
      .card h2{font-size:clamp(30px,3vw,44px);margin-bottom:12px}
      .card p{margin-bottom:18px}
      .footer{padding-block:14px 18px}
    }
    @media(max-width:1100px){
      .main{grid-template-columns:minmax(0,1fr);gap:0;align-content:center;padding-block:16px}
      .intro,.footer{display:none}
      .card{max-width:490px;justify-self:center;padding:clamp(22px,4vw,34px)}
      .card-label{margin-bottom:clamp(16px,3vh,24px)}
      .check{margin-bottom:clamp(13px,2vh,18px)}
      .card h2{font-size:clamp(30px,5vw,40px)}
      .card p{margin-bottom:clamp(18px,3vh,22px)}
    }
    @media(max-width:480px){
      .header{padding-top:clamp(14px,3vh,26px)}
      .header-note{font-size:9px;letter-spacing:.1em}
      .logo{width:clamp(145px,40vw,170px)}
      .card{padding:clamp(20px,4vh,29px)}
      .card h2{font-size:clamp(31px,8.5vw,39px)}
    }
    @media(max-width:380px){.header-note{display:none}}
    @media(max-height:540px){
      .header{padding-top:12px}
      .logo{width:145px}
      .main{padding-block:8px}
      .card{padding:20px}
      .card-label{margin-bottom:12px;font-size:9px}
      .check{width:38px;height:38px;margin-bottom:12px}
      .check svg{width:22px;height:22px}
      .card h2{font-size:30px;margin-bottom:10px}
      .card p{font-size:14px;line-height:1.4;margin-bottom:13px}
      .back{min-height:42px;padding-block:8px}
    }
    @media(prefers-reduced-motion:reduce){.back{transition:none}}
  </style>
</head>
